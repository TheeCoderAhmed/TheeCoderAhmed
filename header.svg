<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="t d">
  <title id="t">Ahmed Haidar, Software Engineer</title>
  <desc id="d">Animated banner. The name fades in with a moving shimmer, and a typed line cycles through stack, focus and availability.</desc>
  <defs>
    <!-- user-space gradient so the cover rect below matches the background exactly -->
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="250">
      <stop offset="0" stop-color="#06201F"/>
      <stop offset="1" stop-color="#0B4F4A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.88" cy="0.05" r="0.75">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="580" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.42" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#5EEAD4"/>
      <stop offset="0.58" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-560 0" to="560 0" dur="4.5s" begin="1.4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="250" rx="20" fill="url(#bg)"/>

  <!-- typed lines: one visible at a time (opacity), revealed by the cover rect below -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" fill="#CFFAF0">
    <text x="70" y="192" textLength="594" lengthAdjust="spacing" opacity="1">Software Engineer: Flutter &#183; NestJS &#183; Next.js
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0909;0.3712" calcMode="discrete" dur="13.2s" repeatCount="indefinite"/>
    </text>
    <text x="70" y="192" textLength="515" lengthAdjust="spacing" opacity="0">Mobile, web and backend for real users.
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3939;0.6742" calcMode="discrete" dur="13.2s" repeatCount="indefinite"/>
    </text>
    <text x="70" y="192" textLength="647" lengthAdjust="spacing" opacity="0">Open to roles: Ankara &#183; Istanbul &#183; Qatar &#183; Remote
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.6970;0.9773" calcMode="discrete" dur="13.2s" repeatCount="indefinite"/>
    </text>
  </g>
  <!-- cover: same gradient as the background; its left edge is the typing front -->
  <rect x="70" y="166" width="0" height="40" fill="url(#bg)">
    <animate attributeName="x" values="70;70;666;666;70;70;587;587;70;70;719;719;70;70" keyTimes="0;0.0909;0.2121;0.3636;0.3712;0.3939;0.5152;0.6667;0.6742;0.6970;0.8182;0.9697;0.9773;1" dur="13.2s" repeatCount="indefinite"/>
    <animate attributeName="width" values="710;710;114;114;710;710;193;193;710;710;61;61;710;710" keyTimes="0;0.0909;0.2121;0.3636;0.3712;0.3939;0.5152;0.6667;0.6742;0.6970;0.8182;0.9697;0.9773;1" dur="13.2s" repeatCount="indefinite"/>
  </rect>

  <rect width="1000" height="250" rx="20" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="999" height="249" rx="19.5" fill="none" stroke="#5EEAD4" stroke-opacity="0.18"/>

  <!-- name -->
  <text x="60" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="800" fill="url(#shine)" textLength="510" lengthAdjust="spacing">Ahmed Haidar
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0s" fill="freeze"/>
  </text>
  <rect x="62" y="138" width="96" height="4" rx="2" fill="#5EEAD4">
    <animate attributeName="width" from="0" to="96" dur="0.8s" begin="0.6s" fill="freeze"/>
  </rect>

  <!-- cursor follows the typing front -->
  <rect x="70" y="170" width="3" height="28" rx="1.5" fill="#5EEAD4">
    <animate attributeName="x" values="70;70;666;666;70;70;587;587;70;70;719;719;70;70" keyTimes="0;0.0909;0.2121;0.3636;0.3712;0.3939;0.5152;0.6667;0.6742;0.6970;0.8182;0.9697;0.9773;1" dur="13.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" calcMode="discrete" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- availability pill -->
  <rect x="796" y="30" width="144" height="36" rx="18" fill="#5EEAD4" fill-opacity="0.1" stroke="#5EEAD4" stroke-opacity="0.35"/>
  <circle cx="819" cy="48" r="5" fill="#5EEAD4"/>
  <circle cx="819" cy="48" r="5" fill="#5EEAD4" opacity="0.6">
    <animate attributeName="r" values="5;14" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="836" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#D5FBF4">Open to work</text>
</svg>
